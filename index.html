<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Student — Academic Productivity Platform</title>
  <meta name="description"
    content="Centralized academic productivity platform for university students and faculty. Track schedules, assignments, attendance, exams, grades, and AI doubt solving.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy-950: #080F1D;
      --navy-900: #0B1220;
      --navy-800: #111C2E;
      --blue-600: #2563EB;
      --blue-500: #3B82F6;
      --blue-400: #60A5FA;
      --surface: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #64748B;
      --border-default: #E2E8F0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0b1220 50%, #080f1d 100%);
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }

    .redirect-card {
      background: rgba(17, 28, 46, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 2.75rem 2.25rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-icon-wrapper {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.5);
    }

    .brand-icon-wrapper svg {
      width: 32px;
      height: 32px;
      stroke: #ffffff;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
      color: #ffffff;
    }

    p.tagline {
      font-size: 0.925rem;
      color: #94a3b8;
      margin-bottom: 1.75rem;
    }

    .spinner-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .action-links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1.5rem;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.925rem;
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.39);
    }

    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.875rem;
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>

  <!-- Route Controller -->
  <script>
    (function routeSession() {
      try {
        const sessionRaw = sessionStorage.getItem('smart_student_session') || localStorage.getItem('smart_student_session');
        if (sessionRaw) {
          const user = JSON.parse(sessionRaw);
          if (user && user.role === 'faculty') {
            window.location.replace('faculty/dashboard.html');
            return;
          } else if (user) {
            window.location.replace('student/dashboard.html');
            return;
          }
        }
      } catch (e) {
        console.warn('Session parsing error:', e);
      }
      // If unauthenticated or no valid session, redirect to login
      window.location.replace('login.html');
    })();
  </script>
</head>

<body>

  <main class="redirect-card" role="main">
    <div class="brand-icon-wrapper" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
        <path d="M6 12v5c3 3 9 3 12 0v-5" />
      </svg>
    </div>

    <h1>Smart Student</h1>
    <p class="tagline">Academic Productivity &amp; Learning Platform</p>

    <div class="spinner-box" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <span>Routing to your academic portal...</span>
    </div>

    <div class="action-links">
      <a href="login.html" class="btn-primary" id="btn-login">Go to Login Page &rarr;</a>
      <a href="student/dashboard.html" class="btn-secondary" id="btn-student">Direct Student Dashboard</a>
    </div>
  </main>

  <footer>
    &copy; Smart Student University Portal. All rights reserved.
  </footer>

</body>

</html>
